name: Deploy Yahala Sink

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-yahala
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_YAHALA }}
      CLOUDFLARE_ACCOUNT_ID: fb14df399f96dc019b8a82cb48788654
      DEPLOY_WRANGLER_CONFIG: wrangler.yahalausa.jsonc
      DEPLOY_D1_DATABASE_ID: c5aa3f6e-97ec-46f0-8f7a-7cfc77ae573b
      DEPLOY_D1_DATABASE_NAME: sink-yahalausa
      DEPLOY_KV_NAMESPACE_ID: 96dd4c82cd7e4ecc91b2c8f76ba44f78
      DEPLOY_R2_BUCKET_NAME: sink-yahalausa
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm deploy:worker
